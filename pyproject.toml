[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "docbarcodes"
version = "1.2.0"
description = "Docbarcodes extracts 1D and 2D barcodes from scanned PDF documents or images."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Arlind Nocaj", email = "nocaja.r@gmail.com" },
]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "click==8.5.0",
  "colorama==0.4.6; sys_platform == 'win32'",
  "jpype1==1.7.1",
  "loguru==0.7.3",
  "markdown-it-py==4.2.0",
  "mdurl==0.1.2",
  "numpy==2.2.6; python_full_version == '3.10.*'",
  "numpy==2.4.4; python_full_version == '3.11.*'",
  "numpy==2.5.2; python_full_version >= '3.12'",
  "opencv-python-headless==5.0.0.93",
  "packaging==26.3",
  "Pillow==12.3.0",
  "pydantic==2.13.4",
  "pydantic-core==2.46.4",
  "pygments==2.21.0",
  "pypdfium2==5.14.0",
  "rich==15.0.0",
  "shellingham==1.5.4",
  "typer==0.27.1",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.4",
  "win32-setctime==1.2.0; sys_platform == 'win32'",
  "zxingmod==0.19",
]

[project.optional-dependencies]
dev = [
  "exceptiongroup==1.3.1; python_full_version < '3.11'",
  "hypothesis==6.168.5",
  "iniconfig==2.3.0",
  "pluggy==1.6.0",
  "pytest==9.1.1",
  "pytest-datadir==1.8.0",
  "pytest-regressions==2.11.0",
  "pyyaml==6.0.3",
  "sortedcontainers==2.4.0",
  "tomli==2.4.1; python_full_version < '3.11'",
]

[project.urls]
"Bug Tracker" = "https://github.com/ArlindNocaj/document-barcodes/issues"
Homepage = "https://github.com/ArlindNocaj/document-barcodes"

[project.scripts]
docbarcodes = "docbarcodes.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["docbarcodes*"]

[tool.setuptools.package-data]
"docbarcodes.zxingjpype" = ["jars/*.jar"]
